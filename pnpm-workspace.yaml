# The two frontends, the code they share and the lab (the local tool the floor's
# items are made in), installed together so every package exists once. The
# Workers keep their own workspaces (their own pnpm-workspace.yaml).
packages:
  - app-frontend
  - marketing-frontend
  - web-shared
  - lab

catalog:
  "@creem_io/embed": 0.3.4
  "@hugeicons/core-free-icons": "^4.3.5"
  "@hugeicons/react": "^1.1.10"
  "@opennextjs/cloudflare": 1.20.6
  "@tailwindcss/postcss": "^4"
  "@types/node": "^20"
  "@types/react": "^19"
  "@types/react-dom": "^19"
  clsx: "^2.1.1"
  eslint: "^9"
  eslint-config-next: 16.0.1
  motion: "^13.4.0"
  next: "^16.0.7"
  next-intl: "^4.14.2"
  phaser: "^3.90.0"
  posthog-js: "^1.407.2"
  react: 19.2.0
  react-dom: 19.2.0
  tailwind-merge: "^3.7.0"
  tailwindcss: "^4"
  typescript: "^5"
  wrangler: 4.131.1

allowBuilds:
  unrs-resolver: true
  workerd: true
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  "@swc/core": false
  core-js: true
